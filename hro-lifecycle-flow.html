<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HRO 员工全生命周期审批流程图</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #f0f2f5;
  font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
  padding: 24px;
}
.page {
  background: #fff;
  max-width: 1380px;
  margin: 0 auto;
  padding: 28px 32px 40px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.10);
  border-radius: 4px;
}
.header {
  text-align: center;
  padding-bottom: 14px;
  border-bottom: 2.5px solid #1a2e5a;
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; color: #1a2e5a; font-weight: 700; letter-spacing: 2px; }
.header p { font-size: 11.5px; color: #888; margin-top: 5px; }
.legend-bar {
  display: flex; align-items: center; gap: 22px;
  justify-content: flex-end;
  margin-bottom: 12px;
  font-size: 11px; color: #555;
  flex-wrap: wrap;
}
.legend-bar .li { display:flex; align-items:center; gap:5px; }
.footer {
  text-align: center; font-size: 11px; color: #aaa;
  margin-top: 20px; padding-top: 10px;
  border-top: 1px solid #e5e8ef;
}
</style>
</head>
<body>
<div class="page">

<div class="header">
  <h1>HRO 人事管理系统 &nbsp;—&nbsp; 员工全生命周期审批流程图</h1>
  <p>Employee Full Lifecycle Approval Flow &nbsp;·&nbsp; V3.2 &nbsp;·&nbsp; 基于产品说明书</p>
</div>

<!-- 图例 -->
<div class="legend-bar">
  <div class="li">
    <svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="#fff" stroke="#555" stroke-width="1.2"/></svg>
    执行步骤
  </div>
  <div class="li">
    <svg width="20" height="20"><polygon points="10,1 19,10 10,19 1,10" fill="#fff" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2"/></svg>
    审批节点
  </div>
  <div class="li">
    <svg width="36" height="12"><line x1="0" y1="6" x2="28" y2="6" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
    <defs><marker id="a1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L0,6L6,3z" fill="#444"/></marker></defs></svg>
    正向流转
  </div>
  <div class="li">
    <svg width="36" height="12"><defs><marker id="a2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L0,6L6,3z" fill="#e74c3c"/></marker></defs>
    <line x1="0" y1="6" x2="28" y2="6" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a2)"/></svg>
    驳回退回
  </div>
</div>

<!-- SVG 主体 -->
<svg id="flow" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 980" width="100%"
     style="display:block;">
<defs>
  <marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#444"/>
  </marker>
  <marker id="arr-r" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#e74c3c"/>
  </marker>
  <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#27ae60"/>
  </marker>
</defs>

<!-- ======= 列宽定义 =======
  泳道标签: x=0, w=56
  列1 员工发起: x=56, w=188  中心x=150
  列2 BU负责人: x=244, w=200 中心x=344
  列3 人事专员: x=444, w=188 中心x=538
  列4 人事负责人:x=632, w=210 中心x=737
  列5 最高负责人:x=842, w=210 中心x=947

-->

<!-- 列标题行 -->

<rect x="56"   y="0" width="188" height="36" fill="#dce6f5"/>
<rect x="244"  y="0" width="200" height="36" fill="#c8d8ee"/>
<rect x="444"  y="0" width="188" height="36" fill="#b8cce8"/>

<text x="28"   y="22" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">泳道</text>

<text x="737"  y="22" text-anchor="middle" fill="#1a2e5a" font-size="11" font-weight="bold">人事负责人</text>
<text x="947"  y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">最高负责人</text>
<text x="1176" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">完成 / 结果</text>
