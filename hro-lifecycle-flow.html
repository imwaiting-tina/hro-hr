<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {

  padding: 20px;
}
.page {
  background: #fff;
  max-width: 1420px;

  padding: 24px 28px 32px;

  margin-bottom: 10px;
  font-size: 10.5px; color: #555;
  flex-wrap: wrap;
}
.legend-bar .li { display:flex; align-items:center; gap:4px; }
.footer {
  text-align: center; font-size: 10.5px; color: #aaa;
  margin-top: 16px; padding-top: 8px;
  border-top: 1px solid #e5e8ef;
}
