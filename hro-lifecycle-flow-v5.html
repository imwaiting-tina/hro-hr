.page {

}

.flow-outer {
  overflow: auto;
  max-height: 82vh;
  max-width: 100%;
  border: 1px solid #ccc;
}
.flow-flex {
  display: flex;
  width: fit-content;
  min-width: 100%;
}
/* 左侧 sticky 列 */
.sticky-col {
  position: sticky;
  left: 0;
  z-index: 20;
  background: #fff;
  flex: none;
}
/* 表头 sticky top */
.hdr-sticky {
  position: sticky;
  top: 0;
  z-index: 25;
  background: #fff;
}
/* 滚动内容列 */
.scroll-col {
  flex: none;
}
svg { display:block; }
